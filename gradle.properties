# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ── JVM Heap ─────────────────────────────────────────────────────────────────
# Subido de 2048m → 4g para soportar compilación de Compose + emulador al mismo
# tiempo sin timeout. Si tu equipo tiene menos de 8 GB de RAM, baja a 3g.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# ── Paralelismo y caché ───────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ── Android ──────────────────────────────────────────────────────────────────
android.useAndroidX=true

# Suprime el warning "New Minor Gradle Version Available" en el canal stable
# (evita el banner azul que aparece en Build Output)
android.suppressUnsupportedCompileSdk=35

# ── Kotlin ────────────────────────────────────────────────────────────────────
kotlin.code.style=official

# Suprime el warning de debugRuntimeClasspath que AGP 8.5 genera con
# dependencias de Compose que tienen artefactos de Android en su POM.
# Ref: https://issuetracker.google.com/issues/328687478
android.dependency.excludeLibraryComponentsFromConstraints=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
