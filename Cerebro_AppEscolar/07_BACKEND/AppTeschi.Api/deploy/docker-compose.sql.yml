# SQL Server 2022 Express en Docker. Se usa contenedor porque Microsoft solo
# documenta soporte nativo hasta Ubuntu 24.04 (no hay confirmación para 26.04).
# Express es gratis y permitido en producción (límite: 10 GB por base).
# La contraseña de sa vive en deploy/.env (la genera 01-instalar.sh, modo 600).
name: appteschi

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: appteschi-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?falta MSSQL_SA_PASSWORD en deploy/.env}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    mem_limit: 2g
    # Solo accesible desde el propio servidor: nunca se expone a la red.
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - appteschi-sql-data:/var/opt/mssql
      - /opt/appteschi/backups:/backups
    healthcheck:
      test:
        - CMD-SHELL
        - 'T=/opt/mssql-tools18/bin/sqlcmd; [ -x "$$T" ] || T=/opt/mssql-tools/bin/sqlcmd; "$$T" -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" >/dev/null'
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

volumes:
  appteschi-sql-data:
